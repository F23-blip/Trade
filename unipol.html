<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0B1220;
    --panel: #121B2E;
    --panel-2: #17223A;
    --line: #263455;
    --text: #ECE7DA;
    --muted: #8B93A7;
    --gain: #2FA36B;
    --gold: #C9A24B;
    --err: #C1443D;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }

  main { width: 100%; max-width: 560px; }

  a.back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 14px;
  }
  a.back:hover { color: var(--gold); }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gain);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  button.icon-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 10px;
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  button.icon-btn:hover { color: var(--text); border-color: var(--gold); }

  .toolbar { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    padding: 8px 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .btn.primario { background: var(--gold); border-color: var(--gold); color: #1a1408; }
  .btn.pericolo { color: var(--err); border-color: var(--line); }
  .btn:hover { border-color: var(--gold); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- card prodotto ---- */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 4px;
  }
  .card-head .nome {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
  }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 3px 7px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .tag.gs { background: rgba(201,162,75,0.16); color: var(--gold); }
  .tag.quote { background: rgba(47,163,107,0.16); color: var(--gain); }
  .tag.polizza { background: rgba(139,147,167,0.2); color: var(--text); }

  .meta {
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 16px;
  }

  .kpi-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .kpi .k { font-size: 11.5px; color: var(--muted); }
  .kpi .v { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; }
  .kpi .v.positivo { color: var(--gain); }
  .kpi .v.negativo { color: var(--err); }
  .kpi .d { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 2px; }

  .chart-wrap { position: relative; height: 170px; margin-bottom: 14px; }
  .chart-empty {
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
    padding: 30px 10px;
  }

  details.storico { margin-bottom: 16px; }
  details.storico summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.03em;
    padding: 4px 0;
    list-style: none;
  }
  details.storico summary::-webkit-details-marker { display: none; }
  details.storico summary:before { content: '▸ '; color: var(--gold); }
  details.storico[open] summary:before { content: '▾ '; }

  table.tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  table.tbl th {
    text-align: right;
    color: var(--muted);
    font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    padding: 4px 6px;
    border-bottom: 1px dashed var(--line);
  }
  table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
  table.tbl td {
    text-align: right;
    padding: 5px 6px;
    font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px dashed var(--line);
    color: var(--text);
  }
  table.tbl tr:last-child td { border-bottom: none; }
  .del-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 13px; padding: 0 2px; line-height: 1;
  }
  .del-btn:hover { color: var(--err); }

  form.add-form {
    border-top: 1px dashed var(--line);
    padding-top: 14px;
  }
  form.add-form .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  form.add-form label {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-bottom: 5px;
  }
  form.add-form input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  form.add-form input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .form-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .form-hint { font-size: 11px; color: var(--muted); }
  .stato-inline {
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
  .stato-inline.visibile { display: block; }
  .stato-inline.ok { color: var(--gain); }
  .stato-inline.errore { color: var(--err); }

  input[type="file"].hidden-file { display: none; }
</style>
</head>

</main>

  const els = {
    cards: document.getElementById('cards'),
    btnEsporta: document.getElementById('btnEsporta'),
    btnImporta: document.getElementById('btnImporta'),
    fileImporta: document.getElementById('fileImporta'),
    btnReset: document.getElementById('btnReset')
  };

  const charts = {};

  function caricaDati() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (err) { /* localStorage non disponibile */ }
    return JSON.parse(JSON.stringify(SEED));
  }

  function salvaDati(dati) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(dati)); }
    catch (err) { /* storage pieno o non disponibile */ }
  }

  let DATI = caricaDati();

  const formatEuro = (n) => (Number(n) || 0).toLocaleString('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });
  const formatNum = (n, dec) => (Number(n) || 0).toLocaleString('it-IT', { maximumFractionDigits: dec != null ? dec : 2, minimumFractionDigits: 0 });

  function parseDataIT(str) {
    const [g, m, a] = (str || '').split('/').map(Number);
    return new Date(a || 1970, (m || 1) - 1, g || 1);
  }
  function formatDataBreve(str) {
    const d = parseDataIT(str);
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: '2-digit' });
  }

  function righeProdotto(prod) {
    const arr = DATI[prod.id] || [];
    return arr.slice().sort((a, b) => parseDataIT(a.data) - parseDataIT(b.data));
  }

  function ultimoValore(righe, field) {
    for (let i = righe.length - 1; i >= 0; i--) {
      if (righe[i][field] != null) return righe[i][field];
    }
    return null;
  }

  function renderKpi(prod, righe) {
    const ultimo = ultimoValore(righe, prod.valueField);
    const capitale = prod.capitaleInvestito;
    let valoreHtml, deltaHtml = '';
    if (ultimo != null) {
      const delta = ultimo - capitale;
      const deltaPct = capitale ? (delta / capitale) * 100 : 0;
      const classe = delta > 0 ? 'positivo' : (delta < 0 ? 'negativo' : '');
      const segno = delta > 0 ? '+' : '';
      valoreHtml = `<span class="v ${classe}">${formatEuro(ultimo)}</span>`;
      deltaHtml = `<div class="d">${segno}${formatEuro(delta)} (${segno}${formatNum(deltaPct, 1)}%) vs capitale investito</div>`;
    } else {
      valoreHtml = `<span class="v">—</span>`;
      deltaHtml = `<div class="d">Nessun dato di controvalore ancora inserito</div>`;
    }
    return `
      <div class="kpi-row">
        <div class="kpi">
          <div class="k">${prod.valueLabel}</div>
          ${valoreHtml}
          ${deltaHtml}
        </div>
        <div class="kpi" style="text-align:right;">
          <div class="k">Capitale investito</div>
          <div class="v" style="font-size:16px;">${formatEuro(capitale)}</div>
          <div class="d">dal ${prod.dataInizio}</div>
        </div>
      </div>`;
  }

  function renderTabella(prod, righe) {
    if (!righe.length) return '<p class="form-hint">Nessuna rilevazione ancora inserita.</p>';
    const cols = [prod.valueField];
    if (prod.rateField) cols.push(prod.rateField);
    if (prod.id === '34fb7a05') cols.push('nQuote');
    const intestazioni = { controvaloreGS: 'Controvalore', valoreQuota: 'Val. quota', controvalore: 'Controvalore', performanceLorda: 'Rend. %', tassoAnnuo: 'Tasso %', nQuote: 'N. quote', rendimentoNetto: 'Rend. netto %' };
    const righeInvertite = righe.slice().reverse();
    const testata = '<tr><th>Data</th>' + cols.map(c => `<th>${intestazioni[c] || c}</th>`).join('') + '<th></th></tr>';
    const corpo = righeInvertite.map((r, idxRev) => {
      const idxOrig = righe.length - 1 - idxRev;
      const celle = cols.map(c => {
        const val = r[c];
        if (val == null) return '<td>—</td>';
        if (c === 'nQuote') return `<td>${formatNum(val, 4)}</td>`;
        if (c === 'valoreQuota') return `<td>${formatNum(val, 3)}</td>`;
        if (c === 'performanceLorda' || c === 'tassoAnnuo' || c === 'rendimentoNetto') return `<td>${formatNum(val, 2)}%</td>`;
        return `<td>${formatEuro(val)}</td>`;
      }).join('');
      return `<tr><td>${formatDataBreve(r.data)}</td>${celle}<td><button class="del-btn" data-prod="${prod.id}" data-idx="${idxOrig}" title="Elimina rilevazione">✕</button></td></tr>`;
    }).join('');
    return `<table class="tbl">${testata}${corpo}</table>`;
  }

  function renderForm(prod) {
    const campi = prod.fields.map(f => `
      <div>
        <label for="in-${prod.id}-${f.key}">${f.label}</label>
        <input type="number" step="${f.step}" id="in-${prod.id}-${f.key}" data-key="${f.key}">
      </div>`).join('');
    return `
      <form class="add-form" data-prod="${prod.id}">
        <div class="field-grid">
          <div>
            <label for="in-${prod.id}-data">Data rilevazione</label>
            <input type="date" id="in-${prod.id}-data" required>
          </div>
          ${campi}
        </div>
        <div class="form-actions">
          <span class="form-hint">Lascia vuoto un campo se non disponibile</span>
          <button type="submit" class="btn primario">Aggiungi</button>
        </div>
        <div class="stato-inline" data-stato></div>
      </form>`;
  }

  function costruisciDatasetGrafico(prod, righe) {
    const conValore = righe.filter(r => r[prod.valueField] != null);
    const labels = conValore.map(r => formatDataBreve(r.data));
    const datasets = [{
      label: prod.valueLabel,
      data: conValore.map(r => r[prod.valueField]),
      borderColor: '#C9A24B',
      backgroundColor: 'rgba(201,162,75,0.12)',
      tension: 0.25,
      pointRadius: 2,
      fill: true,
      yAxisID: 'y'
    }];
    if (prod.rateField) {
      const conTasso = righe.filter(r => r[prod.rateField] != null);
      if (conTasso.length) {
        // riallinea sulle stesse etichette dell'asse principale quando possibile,
        // altrimenti costruisce un proprio asse temporale
        datasets.push({
          label: prod.rateLabel + ' %',
          data: righe.map(r => r[prod.rateField]),
          borderColor: '#2FA36B',
          backgroundColor: 'transparent',
          borderDash: [4, 3],
          tension: 0.25,
          pointRadius: 1.5,
          spanGaps: true,
          yAxisID: 'y1'
        });
      }
    }
    return { labels: righe.map(r => formatDataBreve(r.data)), datasets, soloConValore: labels };
  }

  function renderGrafico(prod, righe, canvasId) {
    const wrap = document.getElementById('wrap-' + canvasId);
    const haValore = righe.some(r => r[prod.valueField] != null);
    if (!haValore) {
      wrap.innerHTML = '<div class="chart-empty">Aggiungi almeno una rilevazione di ' + prod.valueLabel.toLowerCase() + ' per vedere il grafico.</div>';
      return;
    }
    if (typeof Chart === 'undefined') {
      wrap.innerHTML = '<div class="chart-empty">Grafico non disponibile (libreria non caricata). Verifica la connessione e ricarica la pagina.</div>';
      return;
    }
    wrap.innerHTML = `<canvas id="${canvasId}"></canvas>`;
    const ctx = document.getElementById(canvasId).getContext('2d');

    const labels = righe.map(r => formatDataBreve(r.data));
    const datiValore = righe.map(r => (r[prod.valueField] != null ? r[prod.valueField] : null));
    const datasets = [{
      label: prod.valueLabel,
      data: datiValore,
      borderColor: '#C9A24B',
      backgroundColor: 'rgba(201,162,75,0.12)',
      tension: 0.25,
      pointRadius: 2,
      spanGaps: true,
      fill: true,
      yAxisID: 'y'
    }];

    const scales = {
      x: { ticks: { color: '#8B93A7', maxTicksLimit: 6, font: { size: 10 } }, grid: { color: '#1c2740' } },
      y: { ticks: { color: '#8B93A7', font: { size: 10 } }, grid: { color: '#1c2740' } }
    };

    if (prod.rateField) {
      const datiTasso = righe.map(r => (r[prod.rateField] != null ? r[prod.rateField] : null));
      const haTasso = datiTasso.some(v => v != null);
      if (haTasso) {
        datasets.push({
          label: prod.rateLabel + ' %',
          data: datiTasso,
          borderColor: '#2FA36B',
          backgroundColor: 'transparent',
          borderDash: [4, 3],
          tension: 0.2,
          pointRadius: 1.5,
          spanGaps: true,
          yAxisID: 'y1'
        });
        scales.y1 = {
          position: 'right',
          ticks: { color: '#2FA36B', font: { size: 10 }, callback: (v) => v + '%' },
          grid: { drawOnChartArea: false }
        };
      }
    }

    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: datasets.length > 1, labels: { color: '#ECE7DA', font: { size: 10.5 }, boxWidth: 12 } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                if (ctx.dataset.yAxisID === 'y1') return ctx.dataset.label + ': ' + formatNum(ctx.raw, 2) + '%';
                return ctx.dataset.label + ': ' + formatEuro(ctx.raw);
              }
            }
          }
        },
        scales
      }
    });
  }

  function renderCard(prod) {
    const righe = righeProdotto(prod);
    const canvasId = 'chart-' + prod.id;
    return `
      <div class="card" data-prod-card="${prod.id}">
        <div class="card-head">
          <span class="nome">${prod.nome}</span>
          <span class="tag ${prod.tag}">${prod.tipo}</span>
        </div>
        <div class="meta">ID ${prod.id}${prod.quoteIniziali ? ' · quote iniziali ' + formatNum(prod.quoteIniziali, 4) : ''}</div>
        ${renderKpi(prod, righe)}
        <div class="chart-wrap" id="wrap-${canvasId}"></div>
        <details class="storico">
          <summary>Storico rilevazioni (${righe.length})</summary>
          ${renderTabella(prod, righe)}
        </details>
        ${renderForm(prod)}
      </div>`;
  }

  function renderTutto() {
    els.cards.innerHTML = PRODUCTS.map(renderCard).join('');
    PRODUCTS.forEach(prod => {
      try {
        const righe = righeProdotto(prod);
        renderGrafico(prod, righe, 'chart-' + prod.id);
      } catch (err) {
        const wrap = document.getElementById('wrap-chart-' + prod.id);
        if (wrap) wrap.innerHTML = '<div class="chart-empty">Grafico non disponibile al momento.</div>';
      }
    });
    agganciaEventi();
  }

        let almenoUnValore = false;
        form.querySelectorAll('input[data-key]').forEach(inp => {
          if (inp.value !== '') {
            entry[inp.getAttribute('data-key')] = parseFloat(inp.value.replace(',', '.'));
            almenoUnValore = true;
          }
        });
        if (!almenoUnValore) {
          statoEl.textContent = 'Inserisci almeno un valore oltre alla data.';
          statoEl.className = 'stato-inline visibile errore';
          return;
        }
        if (!DATI[prodId]) DATI[prodId] = [];
        DATI[prodId].push(entry);
        salvaDati(DATI);
        renderTutto();
      });
    });

    els.cards.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const prodId = btn.getAttribute('data-prod');
        const righeOrdinate = righeProdotto(PRODUCTS.find(p => p.id === prodId));
        const idx = Number(btn.getAttribute('data-idx'));
        const voce = righeOrdinate[idx];
        if (!voce) return;
        if (!confirm(`Eliminare la rilevazione del ${voce.data}?`)) return;
        const arr = DATI[prodId] || [];
        const pos = arr.indexOf(voce);
        if (pos >= 0) arr.splice(pos, 1);
        salvaDati(DATI);
        renderTutto();
      });
    });
  }

  els.btnEsporta.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(DATI, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'unipol-dati-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  els.btnImporta.addEventListener('click', () => els.fileImporta.click());
  els.fileImporta.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const testo = await file.text();
      const parsed = JSON.parse(testo);
      if (!confirm('Importare questo file sostituirà i dati attuali. Continuare?')) { e.target.value = ''; return; }
      DATI = parsed;
      salvaDati(DATI);
      renderTutto();
    } catch (err) {
      alert('File non valido: ' + err.message);
    } finally {
      e.target.value = '';
    }
  });

  els.btnReset.addEventListener('click', () => {
    if (!confirm('Ripristinare i dati iniziali? Le rilevazioni aggiunte manualmente andranno perse.')) return;
    DATI = JSON.parse(JSON.stringify(SEED));
    salvaDati(DATI);
    renderTutto();
  });

  renderTutto();
})();
</script>

</body>
</html>
