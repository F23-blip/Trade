name: Sync Trade Republic to Google Sheets

on:
  push:
    paths:
      - 'data/transactions.csv'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invia il CSV al foglio
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          csv = open("data/transactions.csv").read()
          payload = json.dumps({"token": os.environ["SYNC_TOKEN"], "csv": csv}).encode()
          req = urllib.request.Request(os.environ["WEBAPP_URL"], data=payload, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          EOF
